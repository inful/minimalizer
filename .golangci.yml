# golangci-lint configuration for minimalizer.
#
# Mirrors the team's repo-config convention (inlined so the project is
# self-contained). Every linter enabled must justify its CPU cost on
# every commit.

version: "2"

linters:
  default: standard
  enable:
    - errorlint      # %w wrapping, errors.Is/As usage
    - gocritic       # opinionated style + diagnostics
    - nakedret       # naked returns in long funcs
    - prealloc       # slice prealloc hints
    - revive         # successor to golint
    - usestdlibvars  # prefer stdlib consts/var over redeclaring
  disable:
    # None of these is in the standard set. They are listed so that a
    # switch to "all" does not turn them on by accident.
    - cyclop         # cyclomatic complexity (gocognit overlaps)
    - dupl           # duplicate code (over-eager on tests)
    - exhaustruct    # constructor struct literal exhaustion
    - funlen         # function length
    - gocognit       # cognitive complexity
    - goconst        # repeated string → constant
    - lll            # line length
    - varnamelen     # variable name length
    - wsl            # whitespace style (gofmt is enough)

  settings:
    gocritic:
      disabled-tags:
        - diagnostic
        - experimental
        - performance
      enabled-tags:
        - style
        - opinionated
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
          disabled: true # package comments handled by linter; opt-out per file

  exclusions:
    rules: []

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/inful/minimalizer
