# goreleaser configuration for github.com/inful/minimalizer.
#
# The tool asks a binary's ELF interpreter for its libraries, so it only
# works on Linux. Only Linux binaries are shipped: a macOS or Windows build
# would install a binary that answers "minimalizer only runs on Linux".
# The CI matrix builds the same Linux platforms, so a break that only happens
# on one of them shows up before the tag.
#
# Draft by default so the maintainer can read the notes before publishing.
# The publish-latest workflow moves the latest tag of the image when the
# release is published, so the two never disagree.
# Docs: https://goreleaser.com/customization/
version: 2

project_name: minimalizer

before:
  hooks:
    # Same suite CI runs, so a regression is caught at tag time rather
    # than by a user downloading the artefact.
    - go mod tidy
    - go test -race -count=1 ./...

builds:
  - id: minimalizer
    main: .
    binary: minimalizer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # main.go declares `var version = "dev"` and overrides it here.
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    # Only armv7 is built. The version is part of the archive name, so a
    # later armv6 build gets a name of its own.
    goarm:
      - "7"
    # Each build gets its own output directory (dist/minimalizer_<os>_<arch>/).
    # Without it every build overwrites dist/minimalizer, and because the
    # archives are assembled after all builds finish, every tar.gz would
    # ship whichever binary was written last.
    no_unique_dist_dir: false

archives:
  - id: default
    formats: [tar.gz]
    # LICENSE and README travel with every artefact: this is GPL-3.0, and
    # the licence text must accompany the binary.
    files:
      - LICENSE
      - README.md
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

# The tool is also published as an image, so a build stage can copy the
# binary out of it instead of building it again:
#
#   COPY --from=ghcr.io/inful/minimalizer:latest /minimalizer /usr/local/bin/minimalizer
#
# The image holds the same static binary as the archives, for the Linux
# architectures that matter here. One buildx call builds every platform and
# pushes a manifest, so `latest` works on every machine.
dockers_v2:
  - id: minimalizer
    dockerfile: Dockerfile.goreleaser
    ids:
      - minimalizer
    images:
      - "ghcr.io/inful/minimalizer"
    # The version of the release only. The latest tag and the tag of the
    # series move when the release is published, in the publish-latest
    # workflow: the release is a draft while it is built, and no tag may
    # point at a version that has no release page yet.
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.source": "https://github.com/inful/minimalizer"
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.description": "Lists the shared libraries a binary needs and prints COPY --from statements for a scratch image"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    # The scope of a conventional commit is part of the subject, so
    # "chore(ci): ..." has to be matched as well as "chore: ...".
    exclude:
      - '^(docs|test|chore|ci|build|style)(\([^)]*\))?:'
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^fix'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^perf'
      order: 2
    - title: 'Code Refactoring'
      regexp: '^refactor'
      order: 3
    - title: Others
      order: 999

release:
  github:
    owner: inful
    name: minimalizer
  draft: true
  prerelease: auto
  # A short description of the tool, so the release page says what it is
  # and not only what changed.
  header: |
    `minimalizer` lists the shared libraries a Linux binary needs and prints
    the `COPY --from` statements that bring them into a `FROM scratch` image.
    Every library is resolved to the real file behind its symlinks and copied
    to the path the dynamic loader expects, so the image holds regular files
    at the paths the loader looks for. No builder has to follow a symlink.

    The archives hold the binary for linux on amd64, arm64 and armv7, and the
    same binary is published as the multi-arch image
    `ghcr.io/inful/minimalizer:{{ .Version }}`.

    The tool has to run inside the build stage that holds the binaries, and
    it only runs on Linux. See the README for the details.

# `brew install` and `apt` are deliberately NOT configured here. The
# binary is named `minimalizer` and it only runs on Linux, so a formula
# would have to be Linux-only too. That is a block to add once a tap
# actually exists; shipping it now would fail the release against a
# repository that may not.
