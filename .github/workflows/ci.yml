# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

# Same gates the local lefthook pre-commit runs (golangci-lint + go test -race)
# on every push to main and every PR. Safety net for contributors who forgot
# to install lefthook.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # No cache: setup-go caches by default, but the key is built from
          # go.sum, and this project has no dependencies, so it could never
          # be restored anyway.
          cache: false

      - name: Run go mod tidy
        run: |
          go mod tidy
          # git status, not git diff: a new go.sum is not in the index yet,
          # and git diff does not look at files that are not tracked.
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod or go.sum is out of date; run 'go mod tidy' locally and commit."
            git status --porcelain -- go.mod go.sum
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        # v7 is required for golangci-lint v2.x configs (v6 only supports v1.x
        # formats). Bump in step with the local tool version.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: Run go test (race)
        run: go test -race -count=1 -timeout 120s ./...

      - name: Check the release config
        # The release config is only read when a tag is pushed, so a broken
        # one has to be caught here instead of at release time.
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        # The binary is `minimalizer`. Install path: `go install .`.
        run: go build -trimpath -ldflags="-s -w" -o dist/minimalizer .

  build-matrix:
    # Compile on every supported platform so platform-specific breakage
    # surfaces before a release, not during. The tool only RUNS on Linux
    # (it asks a binary's ELF interpreter for its libraries), so the
    # release ships Linux binaries only.
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/minimalizer-${{ matrix.os }}-${{ matrix.arch }} .

  docker-build-test:
    # The image is built on every push and every PR, so a broken Dockerfile
    # is caught here instead of at release time.
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=buildkit-test
          cache-to: type=gha,mode=max,scope=buildkit-test
          provenance: false
          sbom: false

      - name: Build the image the tool describes
        # The statement the tool prints is the product. It is built here,
        # from the statement itself and not from a hand written Dockerfile,
        # so a statement that does not build fails in this repository and
        # not in the build of a user.
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e
          go build -trimpath -o /tmp/e2e/minimalizer .
          cd /tmp/e2e
          # The default tree, the one the README shows. The runner user
          # cannot write to /, so the statement is made as root.
          sudo ./minimalizer --package=/rootfs /bin/ls | grep '^COPY' > copy.txt
          cat copy.txt
          {
            echo "FROM debian:bookworm-slim AS builder"
            echo "COPY minimalizer /usr/local/bin/minimalizer"
            echo "RUN minimalizer --package=/rootfs /bin/ls"
            echo "FROM scratch"
            cat copy.txt
            echo 'ENTRYPOINT ["/bin/ls"]'
          } > Dockerfile
          docker build -t minimalizer-e2e .
          # the image has to run: the binary and its libraries are in it
          docker run --rm minimalizer-e2e /bin/ls
