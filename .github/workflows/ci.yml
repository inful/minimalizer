# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

# Same gates the local lefthook pre-commit runs (golangci-lint + go test -race)
# on every push to main and every PR. Safety net for contributors who forgot
# to install lefthook.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod or go.sum is out of date; run 'go mod tidy' locally and commit."
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        # v7 is required for golangci-lint v2.x configs (v6 only supports v1.x
        # formats). Bump in step with the local tool version.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: Run go test (race)
        run: go test -race -count=1 -timeout 120s ./...

      - name: Build
        # The binary is `minimalizer`. Install path: `go install .`.
        run: go build -trimpath -ldflags="-s -w" -o dist/minimalizer .

  build-matrix:
    # Compile on every supported platform so platform-specific breakage
    # surfaces before a release, not during. The tool only RUNS on Linux
    # (it asks a binary's ELF interpreter for its libraries), so the
    # release ships Linux binaries only.
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/minimalizer-${{ matrix.os }}-${{ matrix.arch }} .

  docker-build-test:
    # The Dockerfile lists the source files one by one, so a new file that is
    # not added there breaks the image build. Build it on every PR to catch
    # that here instead of at release time.
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=buildkit-test
          cache-to: type=gha,mode=max,scope=buildkit-test
          provenance: false
          sbom: false
