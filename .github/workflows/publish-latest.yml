# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# The release is a draft while it is built, so the notes can be read before
# they ship. The image is pushed with the tags of the version, but the
# latest tag moves only now, when the release is published: the release page
# and the image must not disagree about which version is the newest.
name: publish latest

on:
  release:
    types: [published]

permissions:
  contents: read
  # The container image is published to the GitHub Container Registry.
  packages: write

jobs:
  latest:
    name: Move the latest tag
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image as latest
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          docker buildx imagetools create \
            --tag ghcr.io/inful/minimalizer:latest \
            "ghcr.io/inful/minimalizer:${version}"
