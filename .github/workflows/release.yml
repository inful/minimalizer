# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Tag-triggered release. Pushing v* tags runs GoReleaser, which builds the
# `minimalizer` binary for the Linux platforms, publishes the container image
# to ghcr.io, and opens a DRAFT GitHub release. Draft so the notes get read
# before they ship: publish it with `gh release edit v0.1.2 --draft=false`
# when the notes are good. The latest tag of the image moves then too, in
# the publish-latest workflow.
#
# The tag is not pushed on every merge on purpose: a release is a decision,
# and this repo is pre-1.0.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # The container image is published to the GitHub Container Registry.
  packages: write

# Never let two releases race on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from git history, so it needs
          # the full history and the tags, not a shallow clone.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # No cache: setup-go caches by default, but the key is built from
          # go.sum, and this project has no dependencies, so it could never
          # be restored anyway.
          cache: false

      - name: Set up QEMU
        # The image is built for arm64 and armv7 as well, so the runner
        # needs to emulate them.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
